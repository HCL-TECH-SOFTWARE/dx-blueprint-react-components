name: Bug report
description: Create a bug report.
labels: ['bug', 'pending assessment']
body:
  - type: checkboxes
    attributes:
      label: Latest version
      description: Bug reports should be filed against the latest version. Please verify before submitting.
      options:
        - label: I have tested the latest version
          required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        Please provide detailed steps to reproduce the issue.
      value: |
        Steps:
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current behavior
      description: Describe what happens instead of the expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: Describe what should happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: |
        Please provide details about your environment.
      value: |
        - Library version:
        - React version:
        - Node version:
        - Browser (if applicable):
        - OS:
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or code samples about the issue.
